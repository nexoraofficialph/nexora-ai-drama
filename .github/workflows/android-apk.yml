name: Build NEXORA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'studio/**'
      - 'capacitor.studio.config.json'
      - '.github/workflows/android-studio-apk.yml'

concurrency:
  group: nexora-viewer-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install project dependencies
        run: npm install

      - name: Validate inline scripts and checkout wiring
        run: node scripts/validate-web.cjs

      - name: Generate Android project
        run: npx cap add android

      - name: Install and validate Firebase Android configuration
        run: |
          node -e "const c=require('./google-services.json'); const clients=c.client||[]; if(c.project_info?.project_id!=='nexora-ai-drama'||!clients.some(x=>x.client_info?.android_client_info?.package_name==='com.nexorastudio.aidrama')) process.exit(1); console.log('Firebase Android config matches NEXORA AI DRAMA.');"
          install -D google-services.json android/app/google-services.json
          test -s android/app/google-services.json

      - name: Generate native launcher and splash assets
        run: npm run assets:android

      - name: Validate Android source assets
        run: npm run validate:source

      - name: Prepare complete Capacitor Android bundle
        run: |
          npm run prepare:web
          mkdir -p www/assets
          cp assets/splash.svg www/assets/
          test -s www/index.html
          test -s www/firebase-config.js
          test -s www/firebase/payment-ui.js

      - name: Sync web app to Android
        run: npx cap sync android

      - name: Verify Firebase assets were copied into Android
        run: |
          test -s android/app/src/main/assets/public/firebase-config.js
          test -s android/app/src/main/assets/public/firebase/payment-ui.js

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-ai-drama-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
