name: Build NEXORA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'studio/**'
      - 'capacitor.studio.config.json'
      - '.github/workflows/android-studio-apk.yml'

concurrency:
  group: nexora-viewer-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install project dependencies
        run: npm install


      - name: Validate inline scripts and Firebase account wiring
        run: node scripts/validate-web.cjs

      - name: Validate Firebase callable backend and security invariants
        run: |
          node --check firebase/functions/index.js
          npm run validate:firebase

      - name: Capture root dependency audit report
        run: npm audit --json > npm-audit-report.json || true

      - name: Install Firebase Functions dependencies
        run: npm install
        working-directory: firebase/functions

      - name: Capture Firebase Functions dependency audit report
        run: npm audit --json > npm-audit-report.json || true
        working-directory: firebase/functions

      - name: Fail build on known npm vulnerabilities
        run: node scripts/check-audit.cjs && node scripts/check-audit.cjs firebase/functions/npm-audit-report.json

      - name: Export generated npm lockfiles for reproducibility
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-generated-npm-lockfiles
          path: |
            package-lock.json
            firebase/functions/package-lock.json
          retention-days: 7

      - name: Generate Android project
        run: npx cap add android

      - name: Apply app release version to Android build
        run: |
          version=$(cat APP_VERSION)
          IFS=. read -r major minor <<< "$version"
          code=$((major * 1000 + minor))
          echo "$version" | grep -Eq "^[0-9]+\\.[0-9]+$"
          sed -i -E "s/versionCode [0-9]+/versionCode ${code}/; s/versionName \"[^\"]+\"/versionName \"${version}\"/" android/app/build.gradle
          grep -q "versionCode ${code}" android/app/build.gradle
          grep -q "versionName \"${version}\"" android/app/build.gradle
          echo "Android version set to ${version} (${code})."

      - name: Install and validate Firebase Android configuration
        run: |
          node -e "const c=require('./google-services.json'); const clients=c.client||[]; if(c.project_info?.project_id!=='nexora-ai-drama'||!clients.some(x=>x.client_info?.android_client_info?.package_name==='com.nexorastudio.aidrama')) process.exit(1); console.log('Firebase Android config matches NEXORA AI DRAMA.');"
          install -D google-services.json android/app/google-services.json
          test -s android/app/google-services.json

      - name: Generate native launcher and splash assets
        run: npm run assets:android

      - name: Validate Android source assets
        run: npm run validate:source

      - name: Prepare complete Capacitor Android bundle
        run: |
          npm run prepare:web
          mkdir -p www/assets
          cp assets/splash.svg www/assets/
          test -s www/index.html
          test -s www/firebase-config.js
          test -s www/firebase/payment-ui.js

      - name: Sync web app to Android
        run: npx cap sync android

      - name: Verify Firebase assets were copied into Android
        run: |
          test -s android/app/src/main/assets/public/firebase-config.js
          test -s android/app/src/main/assets/public/firebase/payment-ui.js

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-ai-drama-dependency-audits
          path: |
            npm-audit-report.json
            firebase/functions/npm-audit-report.json
          retention-days: 14

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-ai-drama-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
