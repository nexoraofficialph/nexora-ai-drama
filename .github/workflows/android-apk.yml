name: Build NEXORA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install project dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Generate native launcher and splash assets
        run: npm run assets:android

      - name: Prepare Capacitor web assets
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest icon.svg app-icon.png supabase-config.js www/
          mkdir -p www/assets
          cp assets/splash.svg www/assets/

      - name: Sync web app to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-ai-drama-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
